<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #173d32; }
    {{styles}}
  </style>
</head>
<body>
  <div class="yk-card-frame">
    <article class="yk-card" data-theme="{{theme}}" style="--yk-background: url('{{background}}')">
      <div class="yk-card__body">
        <div class="yk-card__topline">Marco {{id}} · {{hebrewDate}}</div>
        <div class="yk-card__civil-date">{{civilDate}}</div>
        <div class="yk-card__classification">{{cardClassification}}</div>
        <div class="yk-card__hebrew" lang="he" dir="rtl">{{hebrew}}</div>
        <h1 class="yk-card__title">{{title}}</h1>
        <div class="yk-card__translit">{{transliteration}}</div>
        <div class="yk-card__translation">{{translation}}</div>
        <p class="yk-card__summary">{{cardSummary}}</p>
        <div class="yk-card__practice">
          <strong>Para viver este marco</strong>
          <p>{{cardPractice}}</p>
        </div>
        <div class="yk-card__source">{{cardSource}}</div>
      </div>
      <footer class="yk-card__footer">
        <div>
          <strong>Caminho para Yom Kipur 5787</strong>
          <span>Marcelo Trindade · @marcelositr</span>
        </div>
        <span class="yk-card__site">yomkipur.devnux.com.br</span>
      </footer>
    </article>
  </div>
</body>
</html>
