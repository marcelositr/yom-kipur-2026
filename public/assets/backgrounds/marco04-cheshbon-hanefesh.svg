<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Ambientação do Marco 04: Cheshbon HaNefesh</title>
  <desc id="desc">Mesa silenciosa ao entardecer com caderno aberto, lamparina e luz suave para sugerir exame da própria vida.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173947"/>
      <stop offset="0.55" stop-color="#25463f"/>
      <stop offset="1" stop-color="#132d27"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#674d35"/>
      <stop offset="0.55" stop-color="#4f3b2c"/>
      <stop offset="1" stop-color="#2e291f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eee4cf"/>
      <stop offset="1" stop-color="#c9b993"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f3d28e" stop-opacity="0.72"/>
      <stop offset="0.45" stop-color="#d2aa62" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#d2aa62" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="windowGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#d8b979" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d8b979" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded">
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="soft-light"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#wall)"/>
  <rect width="1080" height="1920" fill="url(#windowGlow)"/>

  <g opacity="0.72">
    <rect x="112" y="245" width="360" height="540" rx="8" fill="#0e2928" stroke="#947a4f" stroke-opacity="0.42" stroke-width="7"/>
    <rect x="136" y="269" width="312" height="492" fill="#1f4850"/>
    <path d="M136 600 C210 535 286 565 350 510 C389 476 420 455 448 430 L448 761 L136 761 Z" fill="#31574f"/>
    <path d="M136 675 C205 624 271 652 334 603 C381 567 412 551 448 535 L448 761 L136 761 Z" fill="#233f39"/>
    <circle cx="380" cy="350" r="92" fill="#b8975d" opacity="0.2"/>
    <line x1="292" y1="269" x2="292" y2="761" stroke="#947a4f" stroke-opacity="0.34" stroke-width="6"/>
  </g>

  <ellipse cx="765" cy="855" rx="365" ry="395" fill="url(#lampGlow)"/>

  <rect y="1120" width="1080" height="800" fill="url(#table)"/>
  <path d="M0 1205 C180 1168 355 1187 533 1172 C713 1157 890 1182 1080 1140 L1080 1920 L0 1920 Z" fill="#49382b" opacity="0.45"/>

  <g transform="translate(585 655)">
    <path d="M188 370 h88 l52 94 h-192 z" fill="#2b261e" opacity="0.95"/>
    <rect x="183" y="213" width="98" height="182" rx="18" fill="#b58d4e" stroke="#d5b575" stroke-width="8"/>
    <rect x="204" y="236" width="56" height="127" rx="12" fill="#ead6a0" opacity="0.6"/>
