    <path d="M56 92 C190 48 315 54 372 91 C435 48 566 53 700 95 L664 412 C548 381 455 383 374 420 C290 382 191 378 80 414 Z" fill="#3a3024" opacity="0.32"/>
    <path d="M72 72 C198 42 302 48 363 82 L363 391 C281 354 190 351 92 382 Z" fill="url(#paper)" stroke="#9f895f" stroke-width="5"/>
    <path d="M363 82 C428 48 542 45 683 75 L662 382 C562 349 468 353 363 391 Z" fill="#e7dcc5" stroke="#9f895f" stroke-width="5"/>
    <path d="M363 82 L363 391" stroke="#9d875f" stroke-width="4"/>
    <g stroke="#8e7a5a" stroke-width="3" opacity="0.46">
      <line x1="120" y1="145" x2="325" y2="145"/>
      <line x1="113" y1="194" x2="325" y2="194"/>
      <line x1="108" y1="244" x2="326" y2="244"/>
      <line x1="103" y1="294" x2="324" y2="294"/>
