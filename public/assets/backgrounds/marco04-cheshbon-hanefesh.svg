      <line x1="402" y1="243" x2="624" y2="243"/>
      <line x1="402" y1="293" x2="620" y2="293"/>
    </g>
    <g fill="#6b5334" opacity="0.72">
      <circle cx="133" cy="145" r="7"/><circle cx="133" cy="194" r="7"/><circle cx="133" cy="244" r="7"/>
      <circle cx="419" cy="143" r="7"/><circle cx="419" cy="193" r="7"/><circle cx="419" cy="243" r="7"/>
    </g>
  </g>

  <g transform="translate(710 1455) rotate(17)">
    <rect x="0" y="0" width="27" height="255" rx="12" fill="#8f6f3f"/>
    <polygon points="0,0 27,0 13,-42" fill="#ded0af"/>
    <polygon points="8,-17 18,-17 13,-42" fill="#2c2c29"/>
  </g>

  <path d="M0 1700 C190 1644 354 1715 530 1684 C716 1650 874 1698 1080 1648 L1080 1920 L0 1920 Z" fill="#182822" opacity="0.36"/>
  <rect width="1080" height="1920" filter="url(#grain)" opacity="0.8"/>
</svg>
