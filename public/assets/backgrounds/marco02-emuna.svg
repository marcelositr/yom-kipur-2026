<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Caminho de pedras ao amanhecer</title>
  <desc id="desc">Paisagem vetorial contemplativa com colinas em camadas, luz dourada e uma sequência de pedras firmes conduzindo ao horizonte.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17344b"/>
      <stop offset="0.42" stop-color="#496661"/>
      <stop offset="0.72" stop-color="#9b805c"/>
      <stop offset="1" stop-color="#d2ae73"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#536a5f"/>
      <stop offset="1" stop-color="#30473f"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#29483e"/>
      <stop offset="1" stop-color="#122f29"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27463b"/>
      <stop offset="1" stop-color="#102a24"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="72%" cy="24%" r="32%">
      <stop offset="0" stop-color="#f3d99f" stop-opacity="0.9"/>
      <stop offset="0.25" stop-color="#e2bb78" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#e2bb78" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

