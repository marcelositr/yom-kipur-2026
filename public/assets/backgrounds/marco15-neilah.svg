  <path d="M506 0H574L560 1920H520Z" fill="#fff4c9" opacity="0.18" filter="url(#blur)"/>

  <path d="M118 1570C260 1512 384 1482 480 1474" fill="none" stroke="#c9a55b" stroke-opacity="0.22" stroke-width="3"/>
  <path d="M962 1570C820 1512 696 1482 600 1474" fill="none" stroke="#c9a55b" stroke-opacity="0.22" stroke-width="3"/>

  <path d="M142 1790H938" stroke="#dbc17e" stroke-opacity="0.13" stroke-width="2"/>
  <path d="M178 1832H902" stroke="#dbc17e" stroke-opacity="0.09" stroke-width="2"/>

  <circle cx="540" cy="394" r="142" fill="none" stroke="#d8bb73" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="540" cy="394" r="88" fill="none" stroke="#d8bb73" stroke-opacity="0.06" stroke-width="2"/>
