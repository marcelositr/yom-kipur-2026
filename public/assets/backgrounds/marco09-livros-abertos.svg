<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Livros abertos sob luz</title>
  <desc id="desc">Três formas abstratas de livros abertos sob luz dourada, usadas como símbolo editorial da imagem talmúdica de responsabilidade.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071f25"/>
      <stop offset="0.55" stop-color="#0b302f"/>
      <stop offset="1" stop-color="#102c27"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="18%" r="68%">
      <stop offset="0" stop-color="#d8bd77" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#b79a5a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#071f25" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ead2" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#d7c89e" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7139" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#d0b46c" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#8b7139" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#glow)"/>

