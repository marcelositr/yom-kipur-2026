<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Ambientação do Marco 10: Aseret Yemei Teshuvá</title>
  <desc id="desc">Escadaria silenciosa antes do amanhecer conduzindo a uma passagem iluminada, sugerindo tempo de resposta e retorno consciente.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071d27"/>
      <stop offset="0.52" stop-color="#123a40"/>
      <stop offset="1" stop-color="#816b46"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243e3a"/>
      <stop offset="1" stop-color="#0d2424"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2dfac" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#c49b56" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff1c6" stop-opacity="0.88"/>
      <stop offset="0.5" stop-color="#d6af65" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d6af65" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#sky)"/>
  <circle cx="540" cy="500" r="330" fill="url(#glow)" filter="url(#blur)"/>

  <path d="M0 820 C170 750 320 790 470 730 C630 668 815 685 1080 590 L1080 1060 L0 1060 Z" fill="#153333" opacity="0.78"/>
  <path d="M0 940 C210 850 385 900 565 830 C730 766 880 790 1080 715 L1080 1120 L0 1120 Z" fill="#0b272b" opacity="0.92"/>

  <rect x="356" y="530" width="368" height="520" rx="8" fill="#102c2a" stroke="#b89557" stroke-width="5"/>
  <rect x="405" y="586" width="270" height="464" fill="#0a2223"/>
  <path d="M428 1050 L652 1050 L625 622 L455 622 Z" fill="url(#light)" opacity="0.9"/>
  <rect x="455" y="622" width="170" height="428" fill="#ead6a1" opacity="0.16"/>

  <path d="M0 1920 L0 1380 L265 1240 L815 1240 L1080 1380 L1080 1920 Z" fill="#071b1e"/>
  <path d="M180 1920 L314 1260 L766 1260 L900 1920 Z" fill="url(#stone)"/>

  <g stroke="#b89557" stroke-opacity="0.22" stroke-width="3">
    <path d="M294 1360 H786"/>
    <path d="M273 1460 H807"/>
    <path d="M250 1570 H830"/>
    <path d="M226 1695 H854"/>
    <path d="M201 1835 H879"/>
  </g>

  <path d="M386 1245 L694 1245 L838 1920 L242 1920 Z" fill="#d1ad6d" opacity="0.08"/>

  <g opacity="0.72">
    <rect x="248" y="1165" width="22" height="92" rx="8" fill="#b89557"/>
    <ellipse cx="259" cy="1156" rx="42" ry="46" fill="url(#glow)"/>
    <rect x="810" y="1165" width="22" height="92" rx="8" fill="#b89557"/>
    <ellipse cx="821" cy="1156" rx="42" ry="46" fill="url(#glow)"/>
  </g>

  <path d="M520 1345 C528 1322 552 1322 560 1345 L569 1452 L511 1452 Z" fill="#071719" opacity="0.9"/>
  <circle cx="540" cy="1315" r="24" fill="#071719" opacity="0.9"/>

  <rect x="24" y="24" width="1032" height="1872" rx="26" fill="none" stroke="#c3a264" stroke-opacity="0.18" stroke-width="2"/>
</svg>
