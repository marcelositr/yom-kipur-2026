<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Caminhos que se reencontram</title>
  <desc id="desc">Paisagem crepuscular com dois caminhos separados que convergem para uma pequena ponte iluminada.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172d35"/>
      <stop offset="0.45" stop-color="#5d6262"/>
      <stop offset="0.7" stop-color="#9c775c"/>
      <stop offset="1" stop-color="#263a31"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="42%">
      <stop offset="0" stop-color="#e6c58b" stop-opacity=".72"/>
      <stop offset="0.45" stop-color="#b99163" stop-opacity=".22"/>
      <stop offset="1" stop-color="#b99163" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#405145"/>
      <stop offset="1" stop-color="#12251f"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdb58d" stop-opacity=".78"/>
      <stop offset="1" stop-color="#796850" stop-opacity=".34"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#sky)"/>
  <rect width="1080" height="1250" fill="url(#glow)"/>
  <circle cx="540" cy="650" r="150" fill="#dbc08c" opacity=".15" filter="url(#blur)"/>

  <path d="M0 930 C180 850 325 865 475 925 C630 985 805 965 1080 865 L1080 1920 L0 1920 Z" fill="#34483b"/>
  <path d="M0 1080 C185 1000 355 1005 520 1055 C700 1110 860 1080 1080 1005 L1080 1920 L0 1920 Z" fill="url(#ground)"/>

  <path d="M-40 1920 C120 1585 250 1370 470 1190 C500 1165 518 1142 540 1110 C420 1215 275 1350 150 1510 C60 1625 2 1735 -40 1820 Z" fill="url(#path)"/>
  <path d="M1120 1920 C980 1590 845 1370 610 1190 C580 1165 558 1140 540 1110 C675 1220 815 1350 940 1510 C1025 1620 1083 1730 1120 1820 Z" fill="url(#path)"/>

  <path d="M420 1150 Q540 1100 660 1150 L640 1190 Q540 1155 440 1190 Z" fill="#6f6657"/>
  <rect x="430" y="1148" width="220" height="22" rx="11" fill="#d1b47d" opacity=".58"/>
  <path d="M455 1170 L455 1240 M625 1170 L625 1240" stroke="#5e574b" stroke-width="20" stroke-linecap="round"/>

  <g opacity=".5" fill="#111f1a">
    <path d="M135 1200 l35 -115 l30 110 l30 -78 l35 118 z"/>
    <path d="M840 1185 l38 -125 l31 118 l31 -85 l36 128 z"/>
    <path d="M55 1370 l34 -105 l30 100 l28 -72 l31 115 z"/>
    <path d="M920 1360 l35 -112 l30 108 l28 -76 l30 118 z"/>
  </g>

  <rect width="1080" height="1920" fill="url(#sky)" opacity=".04"/>
</svg>
