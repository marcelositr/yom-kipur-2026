name: Preflight proof

on:
  push:
    branches:
      - init/project-foundation

permissions:
  contents: write

jobs:
  prove-release-gate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: init/project-foundation
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Execute and record preflight
        shell: bash
        run: |
          set +e
          bash -c 'set -euo pipefail; npm ci; npx playwright install --with-deps chromium; npm run release:check' > preflight.log 2>&1
          status=$?
          set -e

          if [[ "$status" -eq 0 ]]; then
            result="PASS"
          else
            result="FAIL"
          fi

          {
            echo '# Preflight result'
            echo
            echo "- Result: **${result}**"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Runner: \`${RUNNER_OS}\`"
            echo "- Node: \`$(node -v)\`"
            echo "- npm: \`$(npm -v)\`"
            echo
            echo '## Log tail'
            echo
            echo '```text'
            tail -n 120 preflight.log
            echo '```'
          } > docs/PREFLIGHT-RESULT.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/PREFLIGHT-RESULT.md
          git commit -m "chore: record ${result,,} preflight result" || true
          git push origin HEAD:init/project-foundation

          exit "$status"
