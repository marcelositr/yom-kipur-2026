name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/PAGES-RESULT.md
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Probe Pages configuration
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          code="$(curl -sS -o pages-response.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H 'Authorization: Bearer ${{ github.token }}' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          echo "http_code=${code}" >> "$GITHUB_OUTPUT"
          cat pages-response.json || true
          [[ "$code" -lt 400 ]]

      - name: Configure GitHub Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Build site
        id: build
        continue-on-error: true
        run: npm run build

      - name: Upload Pages artifact
        id: upload
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.configure.outcome == 'success' && steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Record deployment result
        if: always()
        shell: bash
        run: |
          if [[ '${{ steps.deployment.outcome }}' == 'success' ]]; then
            result='PASS'
          else
            result='FAIL'
          fi

          cat > docs/PAGES-RESULT.md <<EOF
          # GitHub Pages deployment result

          - Result: **${result}**
          - Source commit: \`${GITHUB_SHA}\`
          - Pages API probe HTTP: \`${{ steps.probe.outputs.http_code }}\`
          - Probe outcome: \`${{ steps.probe.outcome }}\`
          - Configure outcome: \`${{ steps.configure.outcome }}\`
          - Build outcome: \`${{ steps.build.outcome }}\`
          - Upload outcome: \`${{ steps.upload.outcome }}\`
          - Deploy outcome: \`${{ steps.deployment.outcome }}\`
          - Published URL: \`${{ steps.deployment.outputs.page_url }}\`
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/PAGES-RESULT.md
          git commit -m "chore: record GitHub Pages ${result,,} result" || true
          git push origin HEAD:main

      - name: Enforce successful deployment
        if: always()
        shell: bash
        run: |
          [[ '${{ steps.deployment.outcome }}' == 'success' ]]
