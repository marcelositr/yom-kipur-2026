name: Generate social preview

on:
  push:
    branches:
      - fix/social-preview-1200x630

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Render 1200x630 preview
        run: python scripts/generate-social-preview.py

      - name: Update social metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/layouts/BaseLayout.astro')
          text = path.read_text()
          replacements = {
              "socialImage = '/assets/social/yom-kipur-2026-og.jpg'": "socialImage = '/assets/social/yom-kipur-2026-og.png'",
              'content="image/jpeg"': 'content="image/png"',
              'content="600"': 'content="1200"',
              'content="315"': 'content="630"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected social metadata not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit generated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/social/yom-kipur-2026-og.png src/layouts/BaseLayout.astro
          if git diff --cached --quiet; then
            echo "No social preview change."
            exit 0
          fi
          git commit -m "chore: upgrade social preview to 1200x630"
          git push origin HEAD:${GITHUB_REF_NAME}
