name: Bootstrap lockfile

on:
  push:
    branches:
      - init/project-foundation

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: init/project-foundation
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Generate lockfile if missing
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            echo "package-lock.json already exists; nothing to do."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "chore: add npm lockfile"
          git push origin HEAD:init/project-foundation
